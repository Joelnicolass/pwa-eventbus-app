<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>PWA EventBus Console</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🌉 PWA EventBus Console</h1>
        <p class="subtitle">Consola de comunicación PWA ↔ React Native</p>

        <div class="status-bar">
          <div id="connection-status" class="status-indicator">
            <span id="status-text">Inicializando...</span>
          </div>
          <div class="mode-control">
            <label for="mode-selector">Modo:</label>
            <select id="mode-selector">
              <option value="auto">🔄 Auto</option>
              <option value="real">🌉 Real</option>
              <option value="mock">🎭 Mock</option>
            </select>
            <span id="mode-indicator" class="mode-badge auto">AUTO</span>
          </div>
        </div>
      </header>

      <!-- Controles básicos -->
      <section class="controls">
        <div class="button-group">
          <button id="test-btn" class="btn primary">🧪 Test Simple</button>
          <button id="device-btn" class="btn secondary">📱 Device Info</button>
          <button id="location-btn" class="btn secondary">📍 Location</button>
          <button id="storage-btn" class="btn secondary">
            💾 Storage Test
          </button>
        </div>

        <!-- Configuración Mock (solo visible en modo mock) -->
        <div id="mock-controls" class="mock-panel" style="display: none">
          <label>
            <input type="checkbox" id="simulate-errors" />
            Simular errores (10%)
          </label>
          <button id="stats-btn" class="btn small">📊 Stats</button>
        </div>
      </section>

      <!-- Consola principal -->
      <section class="console-section">
        <div class="console-header">
          <h2>📟 Consola de Eventos</h2>
          <div class="console-controls">
            <button id="clear-btn" class="btn small">🗑️ Limpiar</button>
            <label>
              <input type="checkbox" id="auto-scroll" checked />
              Auto-scroll
            </label>
          </div>
        </div>
        <div id="console" class="console"></div>
      </section>

      <!-- Stats mínimas -->
      <footer class="stats-footer">
        <span>Eventos suscritos: <strong id="events-count">0</strong></span>
        <span>Mensajes enviados: <strong id="messages-count">0</strong></span>
        <span id="footer-mode">Modo: Auto-detección</span>
      </footer>
    </div>

    <!-- Scripts -->
    <script src="event_bus/event_bus.js"></script>
    <script src="event_bus/event_bus_mock.js"></script>
    <script src="app.js"></script>
  </body>
</html>
